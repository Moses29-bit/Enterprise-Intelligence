<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

# Keep application source, dependencies, migrations and local configuration
# outside direct web access. The API front controller can still load them.
<DirectoryMatch "^/var/www/html/(app|backend|vendor|database|config|storage|tests)(/|$)">
    Require all denied
</DirectoryMatch>

# Never serve environment files, VCS metadata, Composer metadata or dumps.
<FilesMatch "(^\.env|^\.git|^composer\.(json|lock)$|\.(sql|log|bak|ini)$)">
    Require all denied
</FilesMatch>

# PHP source files are not directly downloadable; permit front-controller files.
<FilesMatch "^(?!index\.php$).+\.php$">
    Require all denied
</FilesMatch>

ServerTokens Prod
ServerSignature Off
